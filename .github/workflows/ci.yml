name: business CI

on:
  push:
    branches: ["**"]
    paths:
      - "business/api/**"
      - "business/scripts/**"
      - "business/tests/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "business/api/**"
      - "business/scripts/**"
      - "business/tests/**"
      - ".github/workflows/ci.yml"

jobs:
  api:
    name: CRM API (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: business/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: business/api/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  scripts:
    name: Automation scripts (compile + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m py_compile business/scripts/*.py business/scripts/lib/*.py
      - run: pip install -r business/tests/requirements.txt
      - name: Run script smoke tests (mock mode, no API key required)
        run: python -m pytest business/tests/ -v
